name: agora
description: "Agora - agendas partagés en groupe, avec bot Discord."
publish_to: 'none'
version: 0.4.1+6

environment:
  sdk: ^3.13.2

dependencies:
  # Le jingle de l'écran d'introduction, rien d'autre. Même bibliothèque que
  # DewDrop et DeckHand : une seule à suivre pour les trois applications.
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  go_router: ^18.0.1
  intl: ^0.20.3
  kalender: ^0.31.3
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Génère AppLocalizations depuis lib/src/localization/*.arb (voir l10n.yaml).
  generate: true
  assets:
    # Produit par tools/sounds/gen_intro_jingle.py, jamais édité à la main.
    - assets/audio/agora_intro.mp3
  # Roboto embarquée (copiée du SDK Flutter, licence Apache 2.0 à côté). Sur le
  # web, Flutter télécharge sinon Roboto depuis fonts.gstatic.com à chaque
  # visite, ce qui transmet l'adresse IP des visiteurs à Google. Déclarer la
  # famille suffit : le moteur ne la télécharge plus. Graisses utilisées par
  # Material (400, 500) et par l'app (600, servie par la plus proche).
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700
